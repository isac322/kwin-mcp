name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  virtual-session-shard:
    name: E2E shard (${{ matrix.row.label }}, ${{ matrix.shard }}/5)
    needs: build-image
    if: ${{ !cancelled() }}
    # Every distribution gates the workflow: a failure on Fedora or Tumbleweed
    # is a kwin-mcp portability bug (the ei_dispatch return type once broke
    # input there only), not noise. Each row runs as five shards; the
    # `virtual-session` aggregator below keeps the required check names.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        row: &e2e_rows
          - distro: debian
            dockerfile: docker/e2e.Dockerfile
            label: amd64
            runner: ubuntu-26.04
          - distro: debian
            dockerfile: docker/e2e.Dockerfile
            label: arm64
            runner: ubuntu-26.04-arm
          - distro: fedora
            dockerfile: docker/e2e-fedora.Dockerfile
            label: fedora-amd64
            runner: ubuntu-26.04
          - distro: fedora
            dockerfile: docker/e2e-fedora.Dockerfile
            label: fedora-arm64
            runner: ubuntu-26.04-arm
          - distro: opensuse
            dockerfile: docker/e2e-opensuse.Dockerfile
            label: opensuse-amd64
            runner: ubuntu-26.04
          - distro: opensuse
            dockerfile: docker/e2e-opensuse.Dockerfile
            label: opensuse-arm64
            runner: ubuntu-26.04-arm
          # Arch Linux publishes amd64 images only; see docker/e2e-arch.Dockerfile.
          - distro: archlinux
            dockerfile: docker/e2e-arch.Dockerfile
            label: archlinux-amd64
            runner: ubuntu-26.04
    runs-on: ${{ matrix.row.runner }}
    timeout-minutes: 30
    env:
      E2E_ARTIFACT_DIR: artifacts/e2e/${{ matrix.row.label }}-s${{ matrix.shard }}
      E2E_CONTAINER_NAME: kwin-mcp-e2e-${{ matrix.row.label }}-s${{ matrix.shard }}
      E2E_SHARD: ${{ matrix.shard }}/5
      E2E_STATUS_FILE: shard-status/${{ matrix.row.label }}-s${{ matrix.shard }}.txt
    steps:
      - uses: actions/checkout@v7

      - name: Create the artifact directories
        run: |
          install -d -m 0777 "$E2E_ARTIFACT_DIR"
          install -d shard-status
          install -d "${{ runner.temp }}/e2e-image"

      - name: Download the KWin test image
        uses: actions/download-artifact@v8
        with:
          name: e2e-image-${{ matrix.row.label }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-image

      - name: Load the KWin test image
        shell: bash
        run: |
          set -o pipefail
          zstd --decompress --stdout \
            "${{ runner.temp }}/e2e-image/image.tar.zst" \
            | docker load
          docker image inspect --format '{{.Id}} {{.Architecture}}' kwin-mcp-e2e

      # Lint and type checks do not depend on the distro or the shard, so run
      # them once per architecture in the Debian image.
      - name: Run quality checks
        if: matrix.row.distro == 'debian' && matrix.shard == 1
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace:ro" \
            --workdir /workspace \
            kwin-mcp-e2e \
            /bin/sh -c '
              /opt/kwin-mcp-venv/bin/ruff check --no-cache src tests &&
              /opt/kwin-mcp-venv/bin/ruff format --check --no-cache src tests &&
              /opt/kwin-mcp-venv/bin/ty check src tests
            '

      # The aggregator proves the shards partition the suite: their
      # collected counts must add up to the unsharded collection that shard 1
      # records here.
      - name: Count collected tests
        shell: bash
        run: |
          set -euo pipefail
          count_tests() {
            docker run --rm --env KWIN_MCP_ARTIFACT_DIR= kwin-mcp-e2e \
              /opt/kwin-mcp-venv/bin/python -m pytest tests \
                --collect-only -q -m "not slow" "$@" \
              | grep -cE '^tests/[^ ]*::'
          }
          collected=$(count_tests --kwin-shard="$E2E_SHARD")
          echo "collected=$collected" >> "$E2E_STATUS_FILE"
          if [[ "${{ matrix.shard }}" == 1 ]]; then
            full=$(count_tests)
            echo "full=$full" >> "$E2E_STATUS_FILE"
          fi
          cat "$E2E_STATUS_FILE"

      # No /dev/dri passthrough on purpose: KWin then runs on the same llvmpipe
      # software path everywhere, so a run here matches a developer's laptop
      # exactly. A DRM node would only let KWin register ScreenShot2, and its
      # virtual backend still never answers a capture — see docker/README.md.
      - name: Run end-to-end tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=1m 20m \
            docker run \
              --name "$E2E_CONTAINER_NAME" \
              --env KWIN_MCP_E2E_STRICT_SKIPS=1 \
              --env KWIN_MCP_E2E_REQUIRE=layer-shell \
              --volume "$PWD/$E2E_ARTIFACT_DIR:/artifacts" \
              kwin-mcp-e2e \
              /opt/kwin-mcp-venv/bin/python -m pytest tests -v \
                -m "not slow" \
                --kwin-shard="$E2E_SHARD" \
                --junitxml=/artifacts/junit.xml \
            2>&1 | tee "$E2E_ARTIFACT_DIR/pytest.log"

      - name: Collect container diagnostics
        if: failure()
        shell: bash
        run: |
          docker inspect "$E2E_CONTAINER_NAME" \
            > "$E2E_ARTIFACT_DIR/docker-inspect.json" \
            2> "$E2E_ARTIFACT_DIR/docker-inspect.stderr" || true
          docker logs --timestamps "$E2E_CONTAINER_NAME" \
            > "$E2E_ARTIFACT_DIR/docker.log" 2>&1 || true
          docker top "$E2E_CONTAINER_NAME" -eo pid,ppid,user,stat,etime,args \
            > "$E2E_ARTIFACT_DIR/docker-processes.txt" 2>&1 || true

      - name: Remove the test container
        if: always()
        run: docker rm --force "$E2E_CONTAINER_NAME" || true

      - name: Normalize artifact permissions
        if: always()
        shell: bash
        run: |
          if [[ -d "$E2E_ARTIFACT_DIR" ]]; then
            sudo chmod -R a+rX "$E2E_ARTIFACT_DIR"
          fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.row.label }}-s${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ env.E2E_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 1

      - name: Record the shard result
        if: always()
        run: echo "result=${{ job.status }}" >> "$E2E_STATUS_FILE"

      - name: Upload the shard status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-status-${{ matrix.row.label }}-attempt-${{ github.run_attempt }}-s${{ matrix.shard }}
          path: shard-status/
          if-no-files-found: error
          retention-days: 1

  build-image:
    name: Build E2E image (${{ matrix.row.label }})
    strategy:
      fail-fast: false
      matrix:
        row: *e2e_rows
    runs-on: ${{ matrix.row.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the KWin test image
        run: docker build --file "${{ matrix.row.dockerfile }}" --tag kwin-mcp-e2e .

      - name: Export the KWin test image
        shell: bash
        run: |
          docker image inspect --format '{{.Id}} {{.Architecture}}' kwin-mcp-e2e
          docker save kwin-mcp-e2e | zstd --threads=0 --fast -o "${{ runner.temp }}/image.tar.zst"

      - name: Upload the KWin test image
        uses: actions/upload-artifact@v7
        with:
          name: e2e-image-${{ matrix.row.label }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Keeps the seven required check names `Virtual KWin session (<label>)`.
  virtual-session:
    name: Virtual KWin session (${{ matrix.row.label }})
    needs: virtual-session-shard
    if: always()
    strategy:
      fail-fast: false
      matrix:
        row: *e2e_rows
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # The label and run attempt precede the shard wildcard so only this
      # row's current-attempt statuses are downloaded.
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-status-${{ matrix.row.label }}-attempt-${{ github.run_attempt }}-s*
          merge-multiple: true
          path: status

      - name: Require every shard to have succeeded and covered the suite
        shell: bash
        run: python3 scripts/check_e2e_shards.py --status-dir status --label "${{ matrix.row.label }}" --shards 5
