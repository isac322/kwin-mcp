name: Docs & SEO Review

# Validates documentation SEO keywords, tool counts, and plugin manifest / SKILL sync on pull requests.
on:
  pull_request:
    paths:
      - "src/kwin_mcp/**"
      - "pyproject.toml"
      - "CHANGELOG.md"
      - "README.md"
      - "ROADMAP.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "integrations/**"
      - ".claude-plugin/**"
      - "scripts/sync_plugin_version.py"

jobs:
  docs-seo-check:
    name: Documentation consistency check
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history needed to diff changed files

      - name: Detect changed source files
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- \
            'src/kwin_mcp/*.py' \
            'pyproject.toml' \
            'integrations/**' \
            '.claude-plugin/**' \
            'scripts/sync_plugin_version.py' \
            2>/dev/null || git diff --name-only HEAD~1 HEAD -- \
            'src/kwin_mcp/*.py' \
            'pyproject.toml' \
            'integrations/**' \
            '.claude-plugin/**' \
            'scripts/sync_plugin_version.py')

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No relevant source files changed — skipping docs review."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "Source files changed:"
            echo "$CHANGED"
          fi

      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.changed.outputs.has_changes == 'true'

      - name: Run docs-seo consistency checks
        if: steps.changed.outputs.has_changes == 'true'
        run: python3 scripts/check_docs_seo.py

      - name: Run plugin version + SKILL sync check
        if: ${{ !cancelled() && steps.changed.outputs.has_changes == 'true' }}
        run: python3 scripts/sync_plugin_version.py --check
