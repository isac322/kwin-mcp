name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uvx --python ${{ matrix.python-version }} ruff check src/ tests/
      - run: uvx --python ${{ matrix.python-version }} ruff format --check src/ tests/

  type-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository-2.0-dev libdbus-1-dev pkg-config
      - run: uv run --locked ty check src/ tests/

  # KWin-free tests: in-process server, schema gates, render goldens, fakes.
  # The Docker E2E shards also collect tests/unit inside each distro image.
  unit:
    name: unit (${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Not 3.15: dbus-python (1.4.0) fails to import on CPython 3.15
        # ("_dbus_bindings.Connection has Py_TPFLAGS_MANAGED_WEAKREF but not
        # Py_TPFLAGS_HAVE_GC"), so nothing that imports kwin_mcp can run there yet.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository-2.0-dev libdbus-1-dev pkg-config gir1.2-atspi-2.0
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: >-
          uv run --locked --python ${{ matrix.python-version }}
          pytest tests/unit -q
          --junitxml=artifacts/unit/junit-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-${{ matrix.python-version }}
          path: artifacts/unit/
          if-no-files-found: warn

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository-2.0-dev libdbus-1-dev pkg-config
      - run: uv lock --check
      - run: uv build
      - run: uvx twine check dist/*
      - run: python3 scripts/check_wheel.py dist/*.whl
      # QA-PKG-003: the wheel run the way users run it serves the 1.0 listing.
      - run: python3 scripts/check_uvx_listing.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  opencode-plugin:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install plugin dependencies
        working-directory: integrations/opencode/plugin
        run: npm install --no-audit --no-fund
      - name: Build plugin
        working-directory: integrations/opencode/plugin
        run: npm run build
      - name: Type-check plugin
        working-directory: integrations/opencode/plugin
        run: npm run typecheck
      - name: Check plugin contract
        working-directory: integrations/opencode/plugin
        run: npm run test:contract
      - name: Pack plugin artifact
        id: pack
        working-directory: integrations/opencode/plugin
        run: |
          artifact_dir="$RUNNER_TEMP/kwin-mcp-plugin-artifact"
          mkdir -p "$artifact_dir"
          npm pack --json --pack-destination "$artifact_dir" >"$artifact_dir/pack.json"
          artifact_name="$(node -e '
            const { readFileSync } = require("node:fs");
            process.stdout.write(JSON.parse(readFileSync(process.argv[1], "utf8"))[0].filename);
          ' "$artifact_dir/pack.json")"
          rm "$artifact_dir/pack.json"
          echo "path=$artifact_dir/$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Smoke-test packed plugin with OpenCode V2 host loader
        env:
          PACKED_ARTIFACT: ${{ steps.pack.outputs.path }}
        run: |
          set -euo pipefail

          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT

          npm init --yes --prefix "$smoke_root" >/dev/null
          npm install --prefix "$smoke_root" --no-audit --no-fund \
            "$PACKED_ARTIFACT" \
            "@opencode/cli@2.0.32"

          cli_version="$("$smoke_root/node_modules/.bin/opencode" --version)"
          printf 'OpenCode version: %s\n' "$cli_version"
          if [[ ! "$cli_version" =~ (^|[^0-9])2\.[0-9] ]]; then
            echo "Expected OpenCode V2, got: $cli_version" >&2
            exit 1
          fi

          cd "$smoke_root"
          cat >"$smoke_root/host-smoke.mjs" <<'NODE'
          import assert from "node:assert/strict";
          import { dirname } from "node:path";
          import { fileURLToPath } from "node:url";
          import { load, resolve } from "@opencode/plugin/host";

          const packageEntry = fileURLToPath(
            import.meta.resolve("@isac322/kwin-mcp-opencode"),
          );
          const packageDir = dirname(dirname(packageEntry));
          const target = {
            directory: packageDir,
            name: "@isac322/kwin-mcp-opencode",
          };
          const entrypoints = resolve(target);
          assert.ok(entrypoints.server, "V2 host loader did not resolve the plugin server");

          const loaded = await load(entrypoints.server);
          assert.ok(loaded && typeof loaded === "object");
          const plugin = loaded.default;
          assert.ok(plugin && typeof plugin === "object");
          assert.equal(plugin.id, "kwin-mcp-opencode");
          assert.equal(typeof plugin.setup, "function");

          const mcpServers = new Map();
          const skills = new Map();
          const mcpEditor = {
            list: () => [...mcpServers.entries()],
            get: (name) => mcpServers.get(name),
            set: (name, config) => mcpServers.set(name, config),
            update: (name, update) => update(mcpServers.get(name)),
            remove: (name) => mcpServers.delete(name),
          };
          const skillEditor = {
            list: () => [...skills.values()],
            get: (id) => skills.get(id),
            add: (skill) => skills.set(skill.id, skill),
            update: (id, update) => update(skills.get(id)),
            remove: (id) => skills.delete(id),
          };
          const context = {
            mcp: {
              transform: async (callback) => {
                callback(mcpEditor);
                return { dispose: async () => {} };
              },
            },
            skill: {
              transform: async (callback) => {
                callback(skillEditor);
                return { dispose: async () => {} };
              },
            },
          };

          await plugin.setup(context);

          const mcpConfig = mcpServers.get("kwin-mcp");
          assert.ok(mcpConfig, "plugin did not register the kwin-mcp MCP server");
          assert.equal(mcpConfig.type, "local");
          assert.deepEqual(mcpConfig.command, ["uvx", "kwin-mcp"]);
          assert.equal(Object.hasOwn(mcpConfig, "enabled"), false);

          const skill = skills.get("kwin-desktop-automation");
          assert.ok(skill, "plugin did not register the kwin-desktop-automation skill");
          console.log("OpenCode V2 host loader registered kwin-mcp and kwin-desktop-automation");
          NODE
          node "$smoke_root/host-smoke.mjs"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, type-check, build, unit]
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
