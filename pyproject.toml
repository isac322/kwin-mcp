[project]
name = "kwin-mcp"
version = "0.8.0"
description = "MCP server for Linux desktop GUI automation on KDE Plasma 6 Wayland — virtual testing and live desktop automation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Byeonghoon Yoo", email = "bhyoo@bhyoo.com" }]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "kwin",
    "kde",
    "wayland",
    "wayland-automation",
    "gui-automation",
    "desktop-automation",
    "plasma",
    "testing",
    "e2e-testing",
    "headless-testing",
    "ai-agents",
    "accessibility",
    "at-spi2",
    "libei",
    "linux-desktop",
    "headless",
    "claude-code",
    "live-desktop",
    "live-session",
    "session-connect",
    "desktop-automation-platform",
    "virtual-session",
    "screen-capture",
    "kiosk-automation",
    "embedded-desktop",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
    "Environment :: X11 Applications :: KDE",
    "Typing :: Typed",
]
dependencies = [
    # mcp 2.x: FastMCP renamed to MCPServer (mcp.server); upper bound until
    # a v3 migration is done (v1->v2 breakage precedent: open >=1.0.0 bound
    # silently resolved to 2.1.1 and broke fresh launches, see wingman #221).
    "mcp>=2.0.0,<3",
    "PyGObject>=3.58.0",
    "dbus-python>=1.4.0",
    "Pillow>=12.3.0",
]

[project.urls]
Homepage = "https://pypi.org/project/kwin-mcp/"
Repository = "https://github.com/isac322/kwin-mcp"
Issues = "https://github.com/isac322/kwin-mcp/issues"
Changelog = "https://github.com/isac322/kwin-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/isac322/kwin-mcp#readme"

[project.scripts]
kwin-mcp = "kwin_mcp.server:main"
kwin-mcp-cli = "kwin_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["kwin_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

# gi.repository and dbus.bus are dynamic modules that cannot be resolved statically
[[tool.ty.overrides]]
include = ["src/kwin_mcp/accessibility.py", "src/kwin_mcp/server.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"
