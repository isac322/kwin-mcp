# ---------------------------------------------------------------------------
# Drift detection thresholds
# ---------------------------------------------------------------------------
drift_detection:
  # Warn if pyproject.toml keywords diverge from pypi_package_keywords by more than this many terms
  pypi_keyword_max_divergence: 3
  # Warn if tool_count in docs differs from this value
  tool_count_canonical: 30
  # Files the docs-seo agent checks for drift
  files_to_audit:
    - path: "CLAUDE.md"
      section: "## Documentation & SEO"
      checks:
        - keyword_coverage     # primary/secondary/long_tail keywords present
        - tool_count_accuracy  # "30 MCP tools" references are current

    - path: ".claude/agents/docs-seo.md"
      section: "## Current Product Positioning"
      checks:
        - mode_descriptions    # both virtual and live modes described
        - tool_count_accuracy
        - entry_point_names    # session_start and session_connect named

    - path: "pyproject.toml"
      section: "[project]"
      checks:
        - keyword_sync         # pypi_package_keywords match
        - description_keywords # description contains required terms

    - path: "README.md"
      section: "H1 and first paragraph"
      checks:
        - dual_mode_presence   # both virtual and live modes mentioned
        - tool_count_accuracy

    - path: "ROADMAP.md"
      section: "## Purpose"
      checks:
        - dual_mode_presence

