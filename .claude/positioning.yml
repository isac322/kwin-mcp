# kwin-mcp Product Positioning Manifest
# ======================================
# This file is the single source of truth for product positioning, keywords,
# and search intents. The docs-seo agent reads this manifest to detect
# positioning drift and uses it when rewriting its own instructions.
#
# Versioning: increment `manifest_version` when making deliberate positioning
# changes. Use semver: MAJOR for repositioning, MINOR for new use cases,
# PATCH for keyword additions/corrections.
#
# After editing this file, run the docs-seo agent to propagate changes.

manifest_version: "1.2.0"
last_updated: "2026-03-29"
product_version_ref: "0.6.0"  # pyproject.toml version this manifest was written against

# ---------------------------------------------------------------------------
# Core identity
# ---------------------------------------------------------------------------
product:
  name: "kwin-mcp"
  tagline: "virtual testing + live desktop automation platform"
  one_liner: >
    MCP server for Linux desktop GUI automation on KDE Plasma 6 Wayland —
    supports both isolated KWin virtual sessions for testing and live desktop
    automation.
  meta_description: >
    MCP server enabling AI agents to automate Linux desktops on KDE Plasma 6
    Wayland — virtual isolated sessions for CI/CD testing and live session
    connection for real desktop automation.
  tool_count: 30
  repo: "https://github.com/isac322/kwin-mcp"
  pypi: "https://pypi.org/project/kwin-mcp/"

# ---------------------------------------------------------------------------
# Modes — describes the two primary operating modes
# ---------------------------------------------------------------------------
modes:
  virtual:
    entry_point: "session_start"
    description: >
      Launches an isolated dbus-run-session + kwin_wayland --virtual sandbox.
      Full D-Bus, display, and input isolation. Ideal for headless GUI testing
      and CI/CD pipelines without a physical display.
    use_cases:
      - Headless end-to-end GUI testing
      - CI/CD pipeline automation
      - Reproducible isolated app testing
      - Development feedback loop (code -> launch -> interact -> verify)
      - Kiosk and embedded device UI testing in isolated virtual displays

  live:
    entry_point: "session_connect"
    description: >
      Connects to a real KDE Plasma desktop or a KWin instance inside a
      container (e.g. systemd-nspawn). Enables collaborative "share my screen"
      workflows and live desktop automation without launching a new session.
    use_cases:
      - Live desktop automation on a real running KDE session
      - '"Share my screen" AI collaboration workflows'
      - Container-based agent desktops (systemd-nspawn, etc.)
      - Real-time accessibility tree inspection of live apps
      - Kiosk and embedded device automation via live session attachment

