name: Temporary immutable-image fixture-fix counterfactual

on:
  push:
    branches: [diag/kwin68-software-render-20261019]

permissions:
  contents: read
  actions: read

jobs:
  native-amd64-probe:
    runs-on: ubuntu-26.04
    # Sequential: 3 collection checks x 60s + 2 nodes x 155s + shard2
    # x 1500s + 6 containers x 20s diagnostics = 2110s. Image API/load
    # bounds add 370s; host/device commands add at most 120s = 2600s.
    # Checkout, local hashing/extraction, and upload fit the remaining margin.
    # Do not run five shards concurrently on this one runner; PR 7x5 is pending.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run mandatory fixed KCalc, CLI, and full shard 2
        timeout-minutes: 44
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .ci-probes/kwin68_native_probe.py

      - name: Make diagnostics readable even after a failed probe
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/kwin68-native-diagnostics" ]; then
            sudo chmod -R a+rX "$RUNNER_TEMP/kwin68-native-diagnostics"
          fi

      # Authenticated Actions artifacts only; never publish logs to a site or PR.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kwin68-native-amd64-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kwin68-native-diagnostics
          retention-days: 14
          if-no-files-found: error
