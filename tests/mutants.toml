# Mutation catalogue M01-M82 (QA list section 8, mutation plan) for scripts/qa_mutants.py
# (gate G14, QA-PKG-012; weekly + workflow_dispatch in .github/workflows/qa-mutants.yml).
#
# Each [[mutant]] is a minimal, plausible bug in the current source:
#   id, module, mutation, source  the plan row (verbatim)
#   qa                            the QA ids that must kill it; equals the `mutants` back-references
#                                 in tests/qa_trace.toml (tests/unit/test_qa_traceability.py)
#   tier                          unit (pytest on tests/unit, no KWin) | e2e (Debian E2E image)
#   kill                          the traced test node ids of those QA ids run for the tier
#   note                          how the patch realises the plan row in the current code
#   [[mutant.patch]]              file + search/replace, applied in order; each search text must
#                                 occur exactly once, or `qa_mutants.py --check` fails.
# A patch that names a pre-1.0 tool is fenced for the stale-name scan
# (tests/unit/test_schema_forbidden_strings.py).

[[mutant]]
id = "M01"
module = "accessibility.py (ref table) + core.py (ref gate)"
mutation = "Ref key = `n` only; drop the gen check at both resolvers"
source = "QX §18"
qa = ["QA-ELEM-022", "QA-ELEM-033", "QA-ELEM-034"]
tier = "e2e"
kill = ["tests/e2e/test_atspi_worker.py::test_accessibility_recovers_when_the_a11y_bus_restarts", "tests/e2e/test_element_refs.py::test_refs_have_generation_prefix_and_resolve", "tests/e2e/test_element_refs.py::test_stale_ref_after_worker_restart_is_tool_error_with_rerun_remedy"]
note = "_RefTable stores entries under the bare counter n and both generation comparisons (core.py _check_ref and _RefTable.resolve) are dropped, so an old-generation ref resolves to whatever the new worker minted at the same n; the restart/session-switch tests expect a 'worker restarted' stale error with nothing invoked. The original worker-only mutation was equivalent: _check_ref rejected old-generation refs with the same text before they reached the worker, so the worker-side check was dead code for every public path."

[[mutant.patch]]
file = "src/kwin_mcp/accessibility.py"
search = '''
        ref = f"e{self.generation}.{self._counter}"
        self._entries[ref] = entry'''
replace = '''
        ref = f"e{self.generation}.{self._counter}"
        self._entries[str(self._counter)] = entry'''

[[mutant.patch]]
file = "src/kwin_mcp/accessibility.py"
search = '''
        if int(match.group(1)) != self.generation:
            msg = f"Stale ref {ref} (AT-SPI worker restarted); re-run element_query."
            raise _StaleRefError(msg)
        entry = self._entries.get(ref)'''
replace = '''
        key = match.group(2)
        entry = self._entries.get(key)'''

[[mutant.patch]]
file = "src/kwin_mcp/accessibility.py"
search = '''
        self._entries.move_to_end(ref)
        return entry'''
replace = '''
        self._entries.move_to_end(key)
        return entry'''

[[mutant.patch]]
file = "src/kwin_mcp/core.py"
search = '''
        if int(match.group(1)) != self._atspi_generation:
            msg = f"Stale ref {ref} (AT-SPI worker restarted); re-run element_query."
            raise RuntimeError(msg)'''
replace = '''
        pass'''

[[mutant]]
id = "M02"
module = "core.py"
mutation = "Do not bump gen on retry-triggered replacement (only on bus change)"
source = "QX §18"
qa = ["QA-ELEM-035"]
tier = "e2e"
kill = ["tests/e2e/test_element_refs.py::test_retry_replacement_bumps_generation"]
note = "_run_atspi's retry attempt rolls the generation back before respawning, so the replacement worker reuses the old gen (only bus/dead-worker detection in _ensure_atspi_worker still bumps); refs then keep the pre-hang gen and the pre-hang ref resolves instead of being stale. The teardown clears _atspi_bus, so the fault is placed on the retry path itself."

[[mutant.patch]]
file = "src/kwin_mcp/core.py"
search = '''
                if attempt > 0:
                    time.sleep(0.5)
                try:
                    proc = self._ensure_atspi_worker()'''
replace = '''
                if attempt > 0:
                    time.sleep(0.5)
                    self._atspi_generation -= 1
                try:
                    proc = self._ensure_atspi_worker()'''

